<style>
/* Layout: a simulator grade sheet on a tablet. One sticky tab bar, then a single working column of ruled panels. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#17212c; --muted:#566373; --rule:#d3dae1; --tint:#e4eaf0;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#dbe7f2;
  --good:#1c7247; --good-soft:#dcf0e4; --warn:#94600a; --warn-soft:#faedcf; --bad:#ab2c2c; --bad-soft:#f9e1e0; --gold:#8a6a10; --gold-soft:#f6edcb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161d; --panel:#18212b; --ink:#e7edf3; --muted:#9dabb9; --rule:#2d3a47; --tint:#212c38;
  --accent:#7db4e6; --accent-ink:#0d1620; --accent-soft:#1f3347;
  --good:#6fcf9b; --good-soft:#183528; --warn:#e8b85c; --warn-soft:#3a2e13; --bad:#f09a96; --bad-soft:#3f1f1f; --gold:#e4c766; --gold-soft:#393013; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --panel:#18212b; --ink:#e7edf3; --muted:#9dabb9; --rule:#2d3a47; --tint:#212c38;
  --accent:#7db4e6; --accent-ink:#0d1620; --accent-soft:#1f3347;
  --good:#6fcf9b; --good-soft:#183528; --warn:#e8b85c; --warn-soft:#3a2e13; --bad:#f09a96; --bad-soft:#3f1f1f; --gold:#e4c766; --gold-soft:#393013; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule)}
.top-in,.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-block:10px 4px}
.brand h1{font-size:27px;font-weight:700}
.brand span{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--display);font-size:19px;font-weight:600;color:var(--muted);min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font:500 12px/20px var(--mono);text-align:center;margin-left:4px}
.wrap{padding-block:16px 40px;display:grid;gap:16px}
.notice{font-size:14px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-size:23px;font-weight:600;margin-bottom:6px}
.panel h3{font-size:19px;font-weight:600}
.lead{color:var(--muted);margin:0 0 12px;max-width:68ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--stripe,var(--accent));border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 34px/1.1 var(--display)}
.stat span{font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 13px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--rule);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:14px}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;min-width:0}
select,input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;min-height:44px;font-weight:400;font-size:16px}
textarea{min-height:70px;resize:vertical}
.group{font:600 15px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--rule);background:var(--panel);min-width:48px;min-height:44px;padding:0 8px;font-weight:600;font-size:14px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.nm[aria-pressed="true"]{background:var(--bad);color:var(--panel)}
.seg button.met[aria-pressed="true"]{background:var(--good);color:var(--panel)}
.cite{grid-column:1/-1;background:var(--bad-soft);border-radius:6px;padding:12px;display:grid;gap:10px}
.cite p{margin:0;font-size:15px}
.cite .btn{background:var(--panel)}
.gate{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.gate p{margin:0;font-size:15px;min-width:0}
.ok{color:var(--good);font-weight:600}.need{color:var(--bad);font-weight:600}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;margin:6px 0}
.bar .lab{grid-column:1/-1;font-size:15px;margin-bottom:-4px}
.track{height:12px;background:var(--tint);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent)}
.fill.warn{background:var(--warn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cell{text-align:center;font-family:var(--mono)}
td.hot{background:var(--warn-soft)}
.done{border-left:5px solid var(--good)}
.likert{display:inline-flex;flex-wrap:wrap}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps li{background:var(--tint);border-radius:6px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.steps b{font:600 19px/1.15 var(--display)}
.steps .n{font:500 13px var(--mono);color:var(--accent)}
.steps p{margin:0;font-size:15px}
.steps .btn{justify-self:start;margin-top:auto}
.commit{margin:0;padding-left:22px;display:grid;gap:6px;max-width:72ch}
.test{background:var(--accent-soft);border-radius:6px;padding:14px;margin-top:14px}
.test q{display:block;quotes:none;font:600 21px/1.2 var(--display);margin-bottom:10px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.split div{background:var(--panel);border-radius:6px;padding:10px 12px;min-width:0}
.split p{margin:2px 0 0;font-size:15px}
.ref{font-size:14px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted)}
@media (max-width:640px){.item{grid-template-columns:minmax(0,1fr)}.brand h1{font-size:24px}.seg button{min-width:46px}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s ease}}
</style>

<script>
(function(){

 ['Regulatory & Procedure',['Required courseware content delivered: taught to the FAA-approved content and facilitator notes','Company and regulatory policy and procedures presented correctly (FOM, FCOM, FCTM)','SOPs applied and taught correctly','All required questions asked','Non-normal, QRH and ECL procedures handled correctly']],
 ['Safety & Evaluator Role',['IOS operation and safety requirements met','Ensures safety of flight; maintains appropriate supervisory and evaluator boundaries','Lesson objectives and requirements completed']],

 ['Debriefing',['Crew-centered debrief; reinforces positives and finds causes','Offers techniques for improved performance']]];
var SOURCES=['I/E AQP Manual','AQPM Qualification Standards','AQPM (other chapter)','FAA-approved courseware','FOM','FCOM','FCTM','QRH / ECL','14 CFR Part 121 / Subpart Y'];
var LIK=['SA','A','N','D','SD','NA'];
var FB=[
 ['Standards findings',[
  ['warranted','The Standards findings were warranted.'],
  ['tied','Each Not Met was tied to a specific standard, not preference or technique.'],

 ['Instruction Quality',[

 ['The session overall',[

  ['dist','Findings stayed on standards and coaching stayed on craft.'],

  ['help','Overall, this calibration will help me improve my instruction.']]]];
var ACT=['CQMV.1','CQMT1.1','CQMT2.1','CQLOE.1','CQLC','CQILT.1'];
var OBS=['Quality Assurance Observation','Supervised Training','Performance Evaluation'];
var IEQS=['IEQ A','IEQ B','IEQ C','IEQ D','IEQ E'];
var DAY=864e5;
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function qStart(d){return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1)}

function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fmt(s){return parse(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function addM(s,m){var d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function seed(){
 var t=today(),q=qStart(t),el=Math.max(1,Math.floor((t-q)/DAY)),inQ=function(f){return iso(new Date(q.getTime()+Math.floor(el*f)*DAY))},ago=function(n){return iso(new Date(t.getTime()-n*DAY))};
 var kinds=['SCP','SI','SCP','SI','SCP','LCP','SI','SCP','SI','SCP','SI','LCP','SCP','SI','SCP','SI'];
 var last=[inQ(.05),inQ(.15),inQ(.3),inQ(.45),inQ(.6),inQ(.75),inQ(.9),ago(125),ago(160),ago(190),ago(250),ago(300),ago(342),ago(354),ago(381),ago(401)];
 var roster=last.map(function(d,i){return{id:'I/E '+String(i+1).padStart(2,'0'),cls:kinds[i],last:d}});
 var F=function(item,behavior,source,ref,cons){return{item:item,behavior:behavior,source:source,ref:ref,cons:cons}};
 var ev=[
  {id:'E1',date:last[0],ie:'I/E 01',ieq:'IEQ A',obs:OBS[0],act:'CQMV.1',find:[],iq:3.4,ex:false},
  {id:'E2',date:last[1],ie:'I/E 02',ieq:'IEQ B',obs:OBS[0],act:'CQMT1.1',find:[F('All required questions asked','Skipped two required questions in the briefing.','I/E AQP Manual','Facilitation Checklist, p.66','Crew missed required content; standardization gap.')],iq:3.0,ex:false},
  {id:'E3',date:last[2],ie:'I/E 03',ieq:'IEQ C',obs:OBS[2],act:'CQLOE.1',find:[F('Ensures safety of flight; maintains appropriate supervisory and evaluator boundaries','Coached the crew during a repeated event set.','AQPM (other chapter)','AQPM 4.3.13, Event Set Remediation','The repeat no longer measures crew performance.')],iq:2.7,ex:false},
  {id:'E4',date:last[3],ie:'I/E 04',ieq:'IEQ A',obs:OBS[1],act:'CQMT2.1',find:[],iq:3.8,ex:true,note:'Crew-led debrief using high-level facilitation.'},
  {id:'E5',date:last[4],ie:'I/E 05',ieq:'IEQ D',obs:OBS[0],act:'CQMV.1',find:[F('Documentation correct, complete, and evaluation accurate','Form not signed until two days after the event.','I/E AQP Manual','AIMS Training Forms, p.11','Delayed record and qualification processing.')],iq:3.2,ex:false},
  {id:'E6',date:last[5],ie:'I/E 06',ieq:'IEQ E',obs:OBS[2],act:'CQLC',find:[],iq:3.5,ex:false},
  {id:'E7',date:last[6],ie:'I/E 07',ieq:'IEQ B',obs:OBS[0],act:'CQLOE.1',find:[],iq:3.6,ex:true,note:'Clean seat-support boundaries and a focused self-assessment.'}];
 var rng=(function(s){return function(){s=(s*16807)%2147483647;return s/2147483647}})(4242);
 var fb=[],keys=[];FB.forEach(function(g){g[1].forEach(function(q){keys.push(q[0])})});
 IEQS.forEach(function(ieq){for(var i=0;i<9;i++){var a={};keys.forEach(function(k,x){
   var p=(ieq==='IEQ C'&&(k==='tech'||k==='notpref'))?.45:.9;
   if(x<4&&i%3===0){a[k]='NA';return}
   var r=rng();a[k]=r<p?(rng()<.55?'SA':'A'):(rng()<.5?'N':'D')});
   fb.push({ieq:ieq,a:a})}});
 return{roster:roster,events:ev,fb:fb}
}
var D=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
var UI={view:'how',draft:null,justDone:null,fbDraft:null,fbFrom:null,fbDone:false,armReset:false};
function status(r){var due=addM(r.last,12),left=Math.round((due-today())/DAY);
 if(left<0)return{k:'over',left:left,due:due,txt:'Overdue',pill:'p-bad',rem:'Escalated to Fleet Standards Captain, '+(-left)+' days past due'};
 if(left<=30)return{k:'due',left:left,due:due,txt:'Due soon',pill:'p-warn',rem:'11-month reminder sent '+fmt(iso(addM(r.last,11)))};
 return{k:'cur',left:left,due:due,txt:'Current',pill:'p-good',rem:'Next reminder '+fmt(iso(addM(r.last,11)))}}
function counts(){var c={cur:0,due:0,over:0};D.roster.forEach(function(r){c[status(r).k]++});return c}
function tabs(){var c=counts(),n=c.due+c.over;var T=[['how','The Proposal'],['board','Currency Board'+(n?'<span class="badge">'+n+'</span>':'')],['cal','Calibrate'],['fb','Instructor Feedback'],['q','Quarterly Meeting']];
 document.getElementById('tabs').innerHTML=T.map(function(t){return'<button class="tab" role="tab" id="tab-'+t[0]+'" data-act="go" data-v="'+t[0]+'" aria-selected="'+(UI.view===t[0])+'">'+t[1]+'</button>'}).join('')}
function foot(){return'<p class="foot">Concept demo for discussion. All names, findings and numbers are invented samples. This is not an approved Company form or record. No emails are sent. Do not enter real names or employee numbers. <button class="btn small" data-act="reset">'+(UI.armReset?'Tap again to confirm reset':'Reset demo')+'</button></p>'}
function vHow(){
 var L=[['Clock','Every I/E sits on a rolling 12-month cycle. Reminder at 11 months, escalation if overdue.','board','Currency Board'],
  ['Calibrate','The IEQ grades on a tablet using the two-category form. A Not Met cannot be saved without its citation.','cal','Calibrate'],
  ['Feedback','The instructor answers anonymously. The form mirrors the same two categories.','fb','Instructor Feedback'],
  ['Data','Grades, citations, feedback and Exemplary flags are captured once, at the point of use.','q','Quarterly Meeting'],
  ['Norm','IEQs meet quarterly, grade the same sample, and reconcile differences to the standard.','q','Quarterly Meeting']];
 var R=[['Fleet Standards Captain / Director of Training','Owns the program, chairs or designates the quarterly meeting, reviews aggregate data, adjudicates disputed findings against the citation, and routes standards questions into the change process.'],
  ['IEQ','Records a Not Met only with a three-part citation, scores Instruction Quality as development, attends the quarterly meeting, and defends any finding from the standard.'],
  ['Observed I/E','Gets a developmental debrief, sees the standard behind any Not Met, completes the anonymous feedback, and may take a disagreement to Fleet Captain review.']];
 var P=[['Phase 1','Roster, 12-month currency tracking, automatic reminders and escalation, digital two-category grading with enforced citations.'],
  ['Phase 2','Anonymous feedback capture, currency and calibration dashboards, feedback aggregation.'],
  ['Phase 3','Calibrator-consistency analytics, Exemplary best-practice library, quarterly report generation, and system-of-record integration.']];
 var A=['Standards updates','Group grading calibration','Instructor feedback review','Review of the quarter’s Standards findings','Category placement: gray areas','Best-practice spotlight','Actions and open items'];
 return'<section class="panel"><h2>IEQ Calibration Standardization Program</h2><p class="lead">Draft proposal for review. The program keeps every calibration anchored to a cited standard, so a pilot gets the same standard from every I/E and an I/E gets the same result from every IEQ.</p>'+
 '<h3>Three commitments</h3><ol class="commit" style="margin-top:6px"><li>Calibration is a learning event.</li><li>A Standards Not Met must be backed by a specific standard or regulation, never personal preference or technique.</li><li>All IEQs meet once per quarter to norm their grading, informed by anonymous feedback from the instructors they observed.</li></ol></section>'+
 '<section class="panel"><h2>The two categories</h2><p class="lead">The form separates SOP from technique, so one cannot be scored as the other.</p><div class="tablewrap"><table><thead><tr><th></th><th>What it measures</th><th>How it is scored</th></tr></thead><tbody>'+
 '<tr><td style="min-width:150px"><b>1. Standards</b></td><td style="min-width:230px">The objective floor: required content, SOPs, safety, records and regulatory compliance. Anything written in a manual.</td><td style="min-width:210px">Met or Not Met. Every Not Met needs a citation.</td></tr>'+
 '<tr><td><b>2. Instruction Quality</b></td><td>Teaching craft: facilitation, delivery and debrief.</td><td>4 to 1 developmental scale. Coaching, not a finding. Exemplary work is recognized here.</td></tr></tbody></table></div>'+
 '<div class="test"><q>Is there a specific SOP, Qualification Standard or regulation this behavior violated?</q><div class="split"><div><b>Yes</b><p>Standards Not Met. Record the behavior, the standard and the consequence.</p></div><div><b>No, but it is not how I would do it</b><p>Not a finding. At most, coaching under Instruction Quality.</p></div></div></div>'+
 '<p class="ref" style="margin:12px 0 0">Example: facilitating a briefing instead of reading it verbatim meets the standard. Skipping a required question does not.</p></section>'+
 '<section class="panel"><h2>How the loop runs</h2><p class="lead">The program sets the process. The app runs it, with no manual currency tracking or re-keying. Open any step to see it working.</p><ol class="steps">'+
 L.map(function(x,i){return'<li><span class="n">Step '+(i+1)+'</span><b>'+x[0]+'</b><p>'+x[1]+'</p><button class="btn small" data-act="go" data-v="'+x[2]+'">'+x[3]+'</button></li>'}).join('')+'</ol></section>'+
